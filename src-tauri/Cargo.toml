[package]
name = "wonder-analyzer"
version = "1.2.0"
authors = ["freebuff"]
edition = "2021"
description = "WonderAnalyzer - Minecraft mod & cheat-config analyzer"
license = "MIT"

[lib]
name = "wonder_analyzer"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wonder-analyzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
ureq = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
