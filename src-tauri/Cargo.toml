[package]
name = "wonder-analyzer"
version = "1.2.0"
description = "WonderAnalyzer - Detect cheats, malware, suspicious mods, and cheat config files"
authors = ["Freebuff"]
edition = "2021"

[lib]
name = "wonder_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = "2"
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# NOTE: panic strategy must stay "unwind" (the default). With panic=abort a
# single panic in a scan thread killed the whole GUI process silently.
